[package]
name = "passbox-cli"
description = "The Passbox command-line client."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/passboxnet/cli"
rust-version = "1.87"
publish = false

[[bin]]
name = "pbx"
path = "src/main.rs"

[dependencies]
passbox-client = { git = "https://github.com/passboxnet/core", tag = "v0.1.0" }
passbox-core = { git = "https://github.com/passboxnet/core", tag = "v0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
rpassword = "7"
serde_json = "1"
clap_complete = "=4.6.11"
# Rules of `pbx scan`; already used by other dependencies.
regex = "=1.13.1"

[dev-dependencies]
axum = "0.8"
passbox-server = { git = "https://github.com/passboxnet/server", tag = "v0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Line tables keep backtraces readable while making debug and test binaries
# several times smaller; dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Key derivation is deliberately expensive; optimize it even in debug builds
# so tests and development builds stay fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
