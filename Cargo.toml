[package]
name = "passbox-cli"
description = "The Passbox command-line client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "pbx"
path = "src/main.rs"

[dependencies]
passbox-client.workspace = true
passbox-core.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs = "7"
rpassword = "7"
serde_json.workspace = true
clap_complete = "=4.6.11"
# Rules of `pbx scan`; already used by other dependencies.
regex = "=1.13.1"

[dev-dependencies]
axum.workspace = true
passbox-server.workspace = true
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
